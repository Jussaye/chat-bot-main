<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/theme.js' %}"></script>
</head>
<body data-authenticated="{% if user.is_authenticated %}true{% else %}false{% endif %}">
    <nav class="nav-sidebar">
        <h1><i class="fa-solid fa-robot" style="color: #ffd700; font-size: 2.1rem; vertical-align: middle; position: relative; top: -3px;"></i> ChatBot</h1>
        <div class="nav-links">
            <a href="{% url 'my-login' %}"><i class="fas fa-sign-in-alt"></i>  Log In</a>
            <a href="{% url 'register' %}"><i class="fas fa-user-plus"></i> Sign Up</a>
        </div>
        
        <div class="theme-toggle-box">
            <div class="theme-toggle-title">
                <i class="fa-solid fa-circle-half-stroke"></i>
                <span>Appearance</span>
            </div>
            <div class="theme-slider-container">
                <div class="theme-icon-btn light-icon" title="Light Mode">
                    <i class="fa-solid fa-sun"></i>
                </div>
                <label class="theme-switch" for="sidebarThemeToggle" aria-label="Toggle dark mode">
                    <input type="checkbox" id="sidebarThemeToggle" class="theme-slider-checkbox">
                    <span class="slider round"></span>
                </label>
                <div class="theme-icon-btn dark-icon" title="Dark Mode">
                    <i class="fa-solid fa-moon"></i>
                </div>
            </div>
        </div>

        <div class="note-container">
            <h1>Note :-</h1>
            Please login to interact with chatbots
        </div>
    </nav>
    <button class="nav-toggle" onclick="toggleNav()">
        <i class="fas fa-chevron-left"></i>
    </button>

    <div class="main-content">
        <div class="top-nav-bar">
            <div class="quick-theme-toggle" title="Switch Theme">
                <i class="fa-solid fa-sun light-icon" style="font-size: 14px;"></i>
                <label class="theme-switch" for="topThemeToggle" aria-label="Toggle dark mode">
                    <input type="checkbox" id="topThemeToggle" class="theme-slider-checkbox">
                    <span class="slider round"></span>
                </label>
                <i class="fa-solid fa-moon dark-icon" style="font-size: 14px;"></i>
            </div>
        </div>
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Type your message...">
                <button id="sendButton" onclick="checkAuthAndSend()" {% if not user.is_authenticated %}disabled{% endif %}>
                    {% if not user.is_authenticated %}
                        <i class="fas fa-lock"></i>
                    {% endif %}
                    Send
                </button>
                <button class="stop-button" id="stopButton" onclick="stopGeneration()">
                    <i class="fas fa-stop"></i> Stop
                </button>
            </div>
        </div>
    </div>

    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/config.local.js' %}" onerror="this.remove()"></script>
    <script src="{% static 'js/main.js' %}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var isAuthenticated = document.body.getAttribute('data-authenticated') === 'true';
            var sendButton = document.getElementById('sendButton');

            // Enable or disable the send button based on authentication
            if (!isAuthenticated) {
                sendButton.disabled = true;
            }
        });

        // Function to check authentication and send message
        function checkAuthAndSend() {
            var isAuthenticated = document.body.getAttribute('data-authenticated') === 'true';
            
            if (isAuthenticated) {
                var chatMessages = document.getElementById('chatMessages');
                var messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';
                messageDiv.innerHTML = '<strong>System:</strong> Please login to use the chat. <a href="{% url "my-login" %}">Login here</a>';
                chatMessages.appendChild(messageDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            } 
        }
    </script>
</body>
</html>
