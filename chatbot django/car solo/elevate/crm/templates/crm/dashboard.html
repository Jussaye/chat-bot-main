<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=2.0">
    <script src="{% static 'js/theme.js' %}?v=2.0"></script>
    <script>
        (function() {
            var theme = localStorage.getItem('chatbot_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.documentElement.className = 'dark-theme';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.className = 'light-theme';
            }
        })();
    </script>
</head>
<body>
    <nav class="nav-sidebar">
        <h1><i class="fa-solid fa-robot" style="color: #ffd700; font-size: 2.1rem; vertical-align: middle; position: relative; top: -3px;"></i> ChatBot</h1>
        <div class="nav-links">
            <a id="login" href="{% url 'user-logout' %}"><i class="fas fa-sign-in-alt"></i>  Log Out</a>
        </div>
        
        <div class="theme-selector-box">
            <div class="theme-selector-title">
                <i class="fa-solid fa-circle-half-stroke"></i>
                <span>Appearance</span>
            </div>
            <div class="theme-btn-group">
                <button type="button" class="theme-btn theme-btn-light active" onclick="setTheme('light')" title="Light Theme">
                    <i class="fa-solid fa-sun"></i>
                    <span>Light</span>
                </button>
                <button type="button" class="theme-btn theme-btn-dark" onclick="setTheme('dark')" title="Dark Theme">
                    <i class="fa-solid fa-moon"></i>
                    <span>Dark</span>
                </button>
            </div>
        </div>

        <div class="note-container">
            <h1>Note :-</h1>
            {% if user.is_authenticated %}
                {{ user.username }} has successfully logined
            {% else %}
                Please login to interact with chatbots
            {% endif %}
        </div>
    </nav>

    
    <button class="nav-toggle" onclick="toggleNav()">
        <i class="fas fa-chevron-left"></i>
    </button>

    <div class="main-content">
        <div class="top-nav-bar">
            <div class="theme-btn-group header-theme-group">
                <button type="button" class="theme-btn theme-btn-light active" onclick="setTheme('light')" title="Light Theme">
                    <i class="fa-solid fa-sun"></i>
                    <span>Light</span>
                </button>
                <button type="button" class="theme-btn theme-btn-dark" onclick="setTheme('dark')" title="Dark Theme">
                    <i class="fa-solid fa-moon"></i>
                    <span>Dark</span>
                </button>
            </div>
        </div>
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Type your message...">
                <button onclick="sendMessage()">Send</button>
                <button class="stop-button" id="stopButton" onclick="stopGeneration()">
                    <i class="fas fa-stop"></i> Stop
                </button>
            </div>
        </div>
    </div>

    <script src="{% static 'js/config.js' %}"></script>
    <script src="{% static 'js/config.local.js' %}" onerror="this.remove()"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
